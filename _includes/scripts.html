<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  (function () {
    var links = document.querySelectorAll("[data-email-link]");

    links.forEach(function (link) {
      var user = link.getAttribute("data-email-user");
      var domain = link.getAttribute("data-email-domain");

      if (!user || !domain) {
        return;
      }

      link.addEventListener("click", function (event) {
        event.preventDefault();
        window.location.href = "mailto:" + user + "@" + domain;
      });
    });
  }());
</script>
