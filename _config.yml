# =============================================================================
# Site Settings
# =============================================================================
locale:                  "en-US"
title:                   "Joseph Kirchhoff"
title_separator:         "|"
subtitle:                "Composites × Computation"
name:                    "Joseph Kirchhoff"
description:             "PhD Student developing computational tools for thermoplastic composites manufacturing"
url:                     "https://jgkirchhoff.github.io"
baseurl:                 ""
repository:              "JgKirchhoff/JgKirchhoff.github.io"
teaser:                  # filename of fallback teaser image in /images/
breadcrumbs:             false
words_per_minute:        200
atom_feed:
  path:                  # blank = default Atom feed

# =============================================================================
# Site Author (shows in left sidebar)
# =============================================================================
author:
  name:             "Joseph Kirchhoff"
  avatar:           "profile.jpg"
  bio:              "Composites × Computation. NASA NSTGRO Fellow @ UT Austin."
  location:         "Austin, TX"
  employer:         "The University of Texas at Austin"
  uri:              
  email:            josephgkirchhoff@gmail.com
  googlescholar:    https://scholar.google.com/citations?user=xi-inBMAAAAJ&hl=en
  github:           "JgKirchhoff"
  linkedin:         joseph-kirchhoff
  orcid:            "0009-0001-1245-4750"


# =============================================================================
# Reading Files
# =============================================================================
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp

# =============================================================================
# Build Settings
# =============================================================================
markdown:        kramdown
remote_theme:    "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"    # we override with our granola SCSS

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# =============================================================================
# HTML Compression
# =============================================================================
compress_html:
  clippings: all
  ignore:
    envs: development

# =============================================================================
# Defaults
# =============================================================================
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  # _publications (if you use the collection later)
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true