# =============================================================================
# Site Settings
# =============================================================================
locale:                  "en-US"
title:                   "Joseph Kirchhoff"
title_separator:         "|"
name:                    "Joseph Kirchhoff"
description:             "PhD Student developing computational tools for thermoplastic composites manufacturing"
url:                     "https://jgkirchhoff.github.io"
baseurl:                 ""
repository:              "JgKirchhoff/JgKirchhoff.github.io"
breadcrumbs:             false
words_per_minute:        200
read_time:               false
atom_feed:
  path:                  # blank = default Atom feed

# =============================================================================
# Site Author (shows in left sidebar)
# =============================================================================
author:
  name:             "Joseph Kirchhoff"
  avatar:           "images/profile.jpg"
  bio:              "Composites × Computation. NASA NSTGRO Fellow @ UT Austin."
  location:         "Austin, TX"
  employer:         "The University of Texas at Austin"
  email:            josephgkirchhoff@gmail.com
  googlescholar:    "https://scholar.google.com/citations?user=xi-inBMAAAAJ&hl=en"
  github:           "JgKirchhoff"
  linkedin:         "joseph-kirchhoff"
  orcid:            "https://orcid.org/0009-0001-1245-4750"

# =============================================================================
# Site Settings - Theme
# =============================================================================
# Academic Pages is NOT minimal-mistakes remote theme
# It includes its own _sass, _layouts, _includes
# Do NOT use remote_theme here
site_theme:              "default"

# =============================================================================
# Markdown / Build
# =============================================================================
markdown:                kramdown
kramdown:
  input:                 GFM
  hard_wrap:             false
  auto_ids:              true
  footnote_nr:           1
  entity_output:         as_char
  toc_levels:            1..6
  smart_quotes:          lsquo,rsquo,ldquo,rdquo
  enable_coderay:        false

# =============================================================================
# Plugins
# =============================================================================
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# =============================================================================
# Reading Files
# =============================================================================
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp

# =============================================================================
# HTML Compression
# =============================================================================
compress_html:
  clippings: all
  ignore:
    envs: development

# =============================================================================
# Collections
# =============================================================================
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  research:
    output: true
    permalink: /:collection/:path/
  software:
    output: true
    permalink: /:collection/:path/

# =============================================================================
# Defaults
# =============================================================================
defaults:
  # _pages
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "single"
      author_profile: true